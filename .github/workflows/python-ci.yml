name: Python CI/CD 

on:
  push:
    branches:
      - main
      # - develop

  pull_request:
    branches:
      - main

jobs:
  # test:
  build-test-push:

    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
    - uses: actions/checkout@v5

    # Set up Python environment
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    # Run tests 
    - name: List files 
      run: |
          ls -la
          find . -name "*.py" -print    
      

    - name: Run Tests
      run: |
        python -m pytest -v 

    # - name: Lint Code
    #   run: |
    #     flake8 .

    - name: Format Check
      run: |
        black --check .

    # Docker login Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build Docker image
    - name: Mk Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-api:latest .


    # Push Docker Hub 
    - name: Push Docker Image to Docker Hub 
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/employee-api:latest


    # Login Azure ACR 
    - name: Login Azure Container Registry
      # uses: azure/docker-login@v3
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}


    # Tag Image for ACR 
    - name: Tag Image for ACR
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/employee-api:latest ${{ secrets.ACR_LOGIN_SERVER }}/employee-api:latest


    # Tag Image for ACR 
    - name: Push Image to ACR 
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/employee-api:latest